<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky3)"/>
  <rect x="0" y="340" width="800" height="160" fill="#2d3748"/>
  <!-- Modern factory -->
  <rect x="80" y="160" width="640" height="180" fill="#4a5568" rx="8"/>
  <rect x="80" y="160" width="640" height="25" fill="#2d3748"/>
  <!-- Glass facade -->
  <rect x="100" y="200" width="200" height="120" fill="#63b3ed" opacity="0.4"/>
  <rect x="320" y="200" width="200" height="120" fill="#63b3ed" opacity="0.4"/>
  <rect x="540" y="200" width="160" height="120" fill="#63b3ed" opacity="0.4"/>
  <!-- Vertical lines -->
  <line x1="200" y1="200" x2="200" y2="320" stroke="#2d3748" stroke-width="2"/>
  <line x1="420" y1="200" x2="420" y2="320" stroke="#2d3748" stroke-width="2"/>
  <line x1="620" y1="200" x2="620" y2="320" stroke="#2d3748" stroke-width="2"/>
  <!-- Loading dock -->
  <rect x="100" y="340" width="120" height="60" fill="#718096"/>
  <rect x="260" y="340" width="120" height="60" fill="#718096"/>
  <rect x="420" y="340" width="120" height="60" fill="#718096"/>
  <!-- Trucks -->
  <rect x="600" y="360" width="100" height="40" fill="#e53e3e"/>
  <rect x="680" y="370" width="30" height="30" fill="#4299e1" opacity="0.6"/>
  <text x="400" y="450" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">冠洲</text>
  <text x="400" y="485" text-anchor="middle" fill="#c9a96e" font-size="18" font-family="Arial, sans-serif">Guanzhou</text>
</svg>