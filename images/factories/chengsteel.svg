<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="sky4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3748"/>
      <stop offset="100%" style="stop-color:#1a365d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky4)"/>
  <rect x="0" y="350" width="800" height="150" fill="#1a202c"/>
  <!-- Hot rolling mill -->
  <rect x="60" y="200" width="680" height="150" fill="#4a5568"/>
  <rect x="60" y="200" width="680" height="25" fill="#e53e3e"/>
  <!-- Rollers -->
  <ellipse cx="200" cy="300" rx="30" ry="30" fill="#718096"/>
  <ellipse cx="350" cy="300" rx="30" ry="30" fill="#718096"/>
  <ellipse cx="500" cy="300" rx="30" ry="30" fill="#718096"/>
  <ellipse cx="650" cy="300" rx="30" ry="30" fill="#718096"/>
  <!-- Steel sheet passing through -->
  <rect x="150" y="285" width="550" height="10" fill="#ecc94b"/>
  <!-- Heat glow -->
  <circle cx="400" cy="290" r="50" fill="#ed8936" opacity="0.3"/>
  <!-- Control room -->
  <rect x="600" y="120" width="140" height="80" fill="#63b3ed" opacity="0.5"/>
  <rect x="600" y="120" width="140" height="15" fill="#2d3748"/>
  <text x="400" y="440" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">承钢</text>
  <text x="400" y="475" text-anchor="middle" fill="#c9a96e" font-size="18" font-family="Arial, sans-serif">Chengsteel</text>
</svg>