  <rect x="80" y="260" width="60" height="100" fill="#4299e1" opacity="0.5"/>
  <rect x="180" y="260" width="60" height="100" fill="#4299e1" opacity="0.5"/>
  <rect x="280" y="260" width="40" height="100" fill="#a0aec0"/>
