<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
    <pattern id="checkerboard" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#b0b0b0"/>
      <rect x="20" y="20" width="20" height="20" fill="#b0b0b0"/>
      <rect x="20" y="0" width="20" height="20" fill="#909090"/>
      <rect x="0" y="20" width="20" height="20" fill="#909090"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)"/>
  <!-- Checkered plate - perspective view -->
  <polygon points="150,150 650,150 700,450 100,450" fill="url(#checkerboard)" stroke="#2d3748" stroke-width="3"/>
  <!-- 3D edge -->
  <polygon points="100,450 700,450 700,470 100,470" fill="#606060"/>
  <!-- Anti-slip texture highlights -->
  <circle cx="250" cy="250" r="8" fill="white" opacity="0.2"/>
  <circle cx="350" cy="280" r="8" fill="white" opacity="0.2"/>
  <circle cx="450" cy="250" r="8" fill="white" opacity="0.2"/>
  <circle cx="550" cy="280" r="8" fill="white" opacity="0.2"/>
  <circle cx="300" cy="350" r="8" fill="white" opacity="0.2"/>
  <circle cx="400" cy="380" r="8" fill="white" opacity="0.2"/>
  <circle cx="500" cy="350" r="8" fill="white" opacity="0.2"/>
  <rect x="250" y="510" width="300" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <text x="400" y="545" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">镀锌花纹板</text>
  <text x="400" y="565" text-anchor="middle" fill="#c9a96e" font-size="16" font-family="Arial, sans-serif">Galvanized Checkered Plates</text>
</svg>