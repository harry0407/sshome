<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
    <radialGradient id="zam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#b0b0b0"/>
      <stop offset="40%" style="stop-color:#808080"/>
      <stop offset="100%" style="stop-color:#505050"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg4)"/>
  <!-- ZAM coil - multiple layers -->
  <ellipse cx="400" cy="280" rx="170" ry="170" fill="url(#zam)" stroke="#2d3748" stroke-width="3"/>
  <ellipse cx="400" cy="280" rx="140" ry="140" fill="none" stroke="#606060" stroke-width="5"/>
  <ellipse cx="400" cy="280" rx="110" ry="110" fill="none" stroke="#606060" stroke-width="4"/>
  <ellipse cx="400" cy="280" rx="80" ry="80" fill="none" stroke="#606060" stroke-width="3"/>
  <ellipse cx="400" cy="280" rx="50" ry="50" fill="none" stroke="#606060" stroke-width="3"/>
  <ellipse cx="400" cy="280" rx="30" ry="30" fill="#2d3748"/>
  <ellipse cx="400" cy="280" rx="20" ry="20" fill="#1a365d"/>
  <!-- Self-healing indicator -->
  <circle cx="500" cy="200" r="30" fill="none" stroke="#48bb78" stroke-width="3" stroke-dasharray="5,5"/>
  <text x="500" y="205" text-anchor="middle" fill="#48bb78" font-size="14">✓</text>
  <rect x="250" y="510" width="300" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <text x="400" y="545" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">锌铝镁卷板</text>
  <text x="400" y="565" text-anchor="middle" fill="#c9a96e" font-size="16" font-family="Arial, sans-serif">Zinc-Aluminum-Magnesium Coils</text>
</svg>