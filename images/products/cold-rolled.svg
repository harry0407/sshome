<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
    <radialGradient id="coil1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a0aec0"/>
      <stop offset="60%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#4a5568"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <!-- Steel coil - main -->
  <ellipse cx="400" cy="280" rx="150" ry="150" fill="url(#coil1)" stroke="#2d3748" stroke-width="4"/>
  <ellipse cx="400" cy="280" rx="100" ry="100" fill="none" stroke="#4a5568" stroke-width="8"/>
  <ellipse cx="400" cy="280" rx="60" ry="60" fill="none" stroke="#4a5568" stroke-width="6"/>
  <ellipse cx="400" cy="280" rx="30" ry="30" fill="#2d3748"/>
  <!-- Inner hole -->
  <ellipse cx="400" cy="280" rx="20" ry="20" fill="#1a365d"/>
  <!-- Shine effect -->
  <ellipse cx="370" cy="250" rx="40" ry="20" fill="white" opacity="0.15" transform="rotate(-30 370 250)"/>
  <!-- Label -->
  <rect x="250" y="500" width="300" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <text x="400" y="535" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">冷卷</text>
  <text x="400" y="555" text-anchor="middle" fill="#c9a96e" font-size="16" font-family="Arial, sans-serif">Cold Rolled Coils</text>
</svg>