<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
    <radialGradient id="galv" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4d4d8"/>
      <stop offset="50%" style="stop-color:#a1a1aa"/>
      <stop offset="100%" style="stop-color:#71717a"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2)"/>
  <!-- Galvanized sheet stack -->
  <rect x="200" y="200" width="400" height="200" fill="url(#galv)" rx="4"/>
  <rect x="200" y="200" width="400" height="8" fill="#e4e4e7"/>
  <rect x="200" y="250" width="400" height="3" fill="#d4d4d8" opacity="0.5"/>
  <rect x="200" y="300" width="400" height="3" fill="#d4d4d8" opacity="0.5"/>
  <rect x="200" y="350" width="400" height="3" fill="#d4d4d8" opacity="0.5"/>
  <!-- Spangle pattern -->
  <circle cx="300" cy="260" r="15" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <circle cx="400" cy="280" r="20" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <circle cx="500" cy="250" r="12" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <circle cx="350" cy="320" r="18" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <circle cx="450" cy="340" r="14" fill="none" stroke="white" stroke-width="1" opacity="0.3"/>
  <!-- Shine -->
  <rect x="220" y="210" width="100" height="30" fill="white" opacity="0.1" rx="2"/>
  <rect x="250" y="500" width="300" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <text x="400" y="535" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">镀锌卷板</text>
  <text x="400" y="555" text-anchor="middle" fill="#c9a96e" font-size="16" font-family="Arial, sans-serif">Galvanized Steel Coils</text>
</svg>