<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d"/>
      <stop offset="100%" style="stop-color:#2a4a7f"/>
    </linearGradient>
    <linearGradient id="galvalume" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#a8a8a8"/>
      <stop offset="100%" style="stop-color:#909090"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <!-- Galvalume coil -->
  <ellipse cx="400" cy="300" rx="160" ry="160" fill="url(#galvalume)" stroke="#2d3748" stroke-width="4"/>
  <ellipse cx="400" cy="300" rx="120" ry="120" fill="none" stroke="#606060" stroke-width="6"/>
  <ellipse cx="400" cy="300" rx="80" ry="80" fill="none" stroke="#606060" stroke-width="4"/>
  <ellipse cx="400" cy="300" rx="40" ry="40" fill="#2d3748"/>
  <ellipse cx="400" cy="300" rx="25" ry="25" fill="#1a365d"/>
  <!-- Metallic shine -->
  <path d="M300,200 Q350,180 400,200 Q450,220 500,200" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
  <ellipse cx="350" cy="250" rx="50" ry="25" fill="white" opacity="0.1" transform="rotate(-20 350 250)"/>
  <rect x="250" y="520" width="300" height="60" fill="rgba(0,0,0,0.3)" rx="8"/>
  <text x="400" y="555" text-anchor="middle" fill="white" font-size="28" font-family="Arial, sans-serif" font-weight="bold">镀铝锌卷板</text>
  <text x="400" y="575" text-anchor="middle" fill="#c9a96e" font-size="16" font-family="Arial, sans-serif">Galvalume Steel Coils</text>
</svg>